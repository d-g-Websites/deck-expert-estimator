<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deck Expert Estimator</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<style>
  .home-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem; }
  .home-actions a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5rem;
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 2.5rem 1rem; text-decoration: none;
    color: var(--brown); font-size: 1.25rem; font-weight: 700; box-shadow: 0 1px 3px rgba(77,46,32,0.07); transition: border-color .1s, transform .1s; }
  .home-actions a:hover { border-color: var(--amber); transform: translateY(-2px); }
  .home-actions a.disabled { opacity: 0.5; pointer-events: none; }
  .home-actions .icon { font-size: 2.5rem; }
  .home-actions .sub { font-size: 0.8rem; font-weight: 500; color: var(--gray); }
  .section-head { margin: 1.5rem 0 0.75rem; }
  .section-head h2 { margin: 0; font-size: 1.05rem; color: var(--brown); }
  .estimate-list { display: flex; flex-direction: column; gap: 0.5rem; }
  .estimate-row { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 1rem; color: var(--text); display: grid; grid-template-columns: 1fr auto; gap: 0.6rem 1rem; align-items: center; }
  .estimate-row .er-main { cursor: pointer; min-width: 0; }
  .estimate-row:hover { border-color: var(--amber); }
  .estimate-row .name { font-weight: 700; color: var(--dark); }
  .estimate-row .meta { font-size: 0.83rem; color: var(--gray); }
  .estimate-row .total { font-weight: 700; color: var(--amber); text-align: right; }
  .er-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 0.5rem; border-top: 1px solid var(--line); padding-top: 0.6rem; }
  .er-actions button { flex: 1; min-width: 110px; padding: 0.5rem 0.6rem; border-radius: var(--radius); font-weight: 600; font-size: 0.85rem; cursor: pointer; border: 1px solid var(--line); background: #fff; color: var(--brown); }
  .er-actions button:disabled { opacity: 0.45; cursor: not-allowed; }
  .er-actions .b-hcp { border-color: var(--amber); color: var(--amber); }
  .er-actions .b-del { border-color: #f3c6c2; color: #b3261e; }
  .er-actions button.busy { opacity: 0.6; pointer-events: none; }
  .placeholder { color: var(--gray); background: #fff; padding: 1.5rem; border-radius: var(--radius); border: 1px dashed var(--line); text-align: center; }
  @media (min-width: 560px) { .home-actions a { padding: 3.5rem 1rem; } }
</style>
</head>
<body>
<div class="topbar">
  <h1>Deck Expert Estimator</h1>
  <form method="POST" action="/logout" style="margin:0"><button type="submit" class="logout">Log out</button></form>
</div>

<main>
  <div class="home-actions">
    <a href="/estimate/new">
      <span class="icon">📋</span>
      <span>New Estimate</span>
      <span class="sub">Build a priced quote</span>
    </a>
    <a href="/visualizer" id="vizBtn">
      <span class="icon">🎨</span>
      <span>Visualizer</span>
      <span class="sub">Preview a stain on a photo</span>
    </a>
  </div>

  <div class="section-head"><h2>Recent estimates</h2></div>
  <div id="estimateList" class="estimate-list"><div class="placeholder">Loading…</div></div>
</main>

<script>
fetch('/api/config').then(r => r.json()).then(cfg => {
  if (!cfg.visualizer_enabled) {
    const v = document.getElementById('vizBtn');
    v.classList.add('disabled');
    v.querySelector('.sub').textContent = 'Set OPENAI_API_KEY to enable';
  }
});

const list = document.getElementById('estimateList');
let HCP_ENABLED = false;
fetch('/api/config').then(r => r.json()).then(cfg => { HCP_ENABLED = !!cfg.hcp_enabled; }).finally(loadEstimates);

function loadEstimates() {
  list.innerHTML = '<div class="placeholder">Loading…</div>';
  fetch('/api/estimates').then(r => r.json()).then(estimates => {
    if (!estimates || estimates.length === 0) {
      list.innerHTML = '<div class="placeholder">No estimates yet. Tap “New Estimate” to start one.</div>';
      return;
    }
    // Group multi-area jobs (shared area_group_id) into one tile; keep recency order.
    const groups = new Map(); const order = [];
    for (const e of estimates) {
      const key = e.area_group_id ? ('g' + e.area_group_id) : ('s' + e.id);
      if (!groups.has(key)) { groups.set(key, []); order.push(key); }
      groups.get(key).push(e);
    }
    list.innerHTML = '';
    for (const key of order) {
      const members = groups.get(key);
      list.appendChild(members.length === 1 ? buildRow(members[0]) : buildGroupRow(members));
    }
  }).catch(err => { list.innerHTML = '<div class="placeholder">Failed to load: ' + esc(err.message) + '</div>'; });
}

function buildGroupRow(members) {
  const row = document.createElement('div');
  row.className = 'estimate-row';
  const groupId = members[0].area_group_id;
  const totalSum = members.reduce((s, m) => s + (m.total || 0), 0);
  const allSynced = members.every(m => m.hcp_synced);
  const areaLines = members.map(m =>
    '<div class="er-area" data-id="' + m.id + '" style="cursor:pointer;padding:0.2rem 0;color:var(--brown)">' +
    '↳ ' + esc(m.scope_title || cap(m.structure_type) || 'Area') + ' · ' + (m.surface_sqft || 0) + ' sq ft · $' + (m.total || 0).toFixed(2) +
    (m.hcp_synced ? ' · ✓' : '') + '</div>').join('');
  row.innerHTML =
    '<div class="er-main"><div class="name">' + esc(members[0].customer_name) + '</div>' +
    '<div class="meta">Multi-area job · ' + members.length + ' areas</div>' +
    '<div class="er-areas" style="margin-top:0.35rem">' + areaLines + '</div></div>' +
    '<div style="text-align:right"><div class="total">$' + totalSum.toFixed(2) + '</div>' +
    '<div class="badge ' + (allSynced ? 'sent' : 'draft') + '">' + (allSynced ? 'sent' : 'draft') + '</div></div>' +
    '<div class="er-actions">' +
      '<button class="b-hcp" type="button">' + (allSynced ? '✓ Sent to HCP' : 'Push all to HCP') + '</button>' +
    '</div>';
  row.querySelectorAll('.er-area').forEach(a => a.addEventListener('click', () => { location.href = '/estimate/' + a.dataset.id; }));
  const hcpBtn = row.querySelector('.b-hcp');
  if (allSynced) { hcpBtn.disabled = true; }
  else if (!HCP_ENABLED) { hcpBtn.disabled = true; hcpBtn.title = 'Set HCP_API_KEY on the server to enable'; }
  else hcpBtn.addEventListener('click', () => pushGroupToHcp(groupId, hcpBtn, row, members.length));
  return row;
}

function pushGroupToHcp(groupId, btn, row, count) {
  if (!confirm('Push all ' + count + ' areas to Housecall Pro? (one estimate with ' + count + ' options)')) return;
  btn.classList.add('busy'); btn.textContent = 'Pushing…';
  fetch('/api/estimate-group/' + groupId + '/send-to-hcp', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ employee_id: getTechId() }),
  })
    .then(async r => { const d = await r.json(); if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status); return d; })
    .then(() => { btn.classList.remove('busy'); btn.textContent = '✓ Sent to HCP'; btn.disabled = true;
      const badge = row.querySelector('.badge'); if (badge) { badge.textContent = 'sent'; badge.className = 'badge sent'; } })
    .catch(err => { btn.classList.remove('busy'); btn.textContent = 'Push all to HCP'; alert('Push failed: ' + err.message); });
}

function buildRow(e) {
  const row = document.createElement('div');
  row.className = 'estimate-row';
  const dt = new Date(e.created_at + 'Z');
  const dateStr = dt.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const svc = [cap(e.structure_type), (e.wood_type || '').replace(/_/g, ' ')].filter(Boolean).join(' · ');
  const synced = !!e.hcp_synced;
  row.innerHTML =
    '<div class="er-main"><div class="name">' + esc(e.customer_name) + '</div>' +
    '<div class="meta">#' + e.id + ' · ' + dateStr + ' · ' + svc + ' · ' + (e.surface_sqft || 0) + ' sq ft</div></div>' +
    '<div style="text-align:right"><div class="total">$' + (e.total || 0).toFixed(2) + '</div>' +
    '<div class="badge ' + e.status + '">' + e.status + '</div></div>' +
    '<div class="er-actions">' +
      '<button class="b-hcp" type="button">' + (synced ? '✓ Sent to HCP' : 'Push to HCP') + '</button>' +
      '<button class="b-edit" type="button">Edit</button>' +
      '<button class="b-del" type="button">Delete</button>' +
    '</div>';

  row.querySelector('.er-main').addEventListener('click', () => { location.href = '/estimate/' + e.id; });
  row.querySelector('.b-edit').addEventListener('click', () => { location.href = '/estimate/' + e.id + '/edit'; });

  const hcpBtn = row.querySelector('.b-hcp');
  if (synced) { hcpBtn.disabled = true; }
  else if (!HCP_ENABLED) { hcpBtn.disabled = true; hcpBtn.title = 'Set HCP_API_KEY on the server to enable'; }
  else hcpBtn.addEventListener('click', () => pushToHcp(e.id, hcpBtn, row));

  row.querySelector('.b-del').addEventListener('click', () => deleteEstimate(e.id, row));
  return row;
}

function getTechId() { try { return (JSON.parse(localStorage.getItem('hcp.tech') || 'null') || {}).id || null; } catch (_) { return null; } }
function pushToHcp(id, btn, row) {
  if (!confirm('Push estimate #' + id + ' to Housecall Pro?')) return;
  btn.classList.add('busy'); btn.textContent = 'Pushing…';
  fetch('/api/estimate/' + id + '/send-to-hcp', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ employee_id: getTechId() }),
  })
    .then(async r => { const d = await r.json(); if (!r.ok) throw new Error(d.error || 'HTTP ' + r.status); return d; })
    .then(() => { btn.classList.remove('busy'); btn.textContent = '✓ Sent to HCP'; btn.disabled = true;
      const badge = row.querySelector('.badge'); if (badge) { badge.textContent = 'sent'; badge.className = 'badge sent'; } })
    .catch(err => { btn.classList.remove('busy'); btn.textContent = 'Push to HCP'; alert('Push failed: ' + err.message); });
}

function deleteEstimate(id, row) {
  if (!confirm('Delete estimate #' + id + '? This cannot be undone.')) return;
  fetch('/api/estimate/' + id, { method: 'DELETE' })
    .then(async r => { if (!r.ok) throw new Error((await r.json()).error || 'HTTP ' + r.status); })
    .then(() => { row.remove(); if (!list.querySelector('.estimate-row')) list.innerHTML = '<div class="placeholder">No estimates yet. Tap “New Estimate” to start one.</div>'; })
    .catch(err => alert('Delete failed: ' + err.message));
}

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
