<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What are we estimating? — Deck Expert</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  .structure-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .structure-grid a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.4rem;
    background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 2rem 1rem; text-decoration: none;
    color: var(--brown); font-size: 1.15rem; font-weight: 700; box-shadow: 0 1px 3px rgba(77,46,32,0.07); }
  .structure-grid a:hover { border-color: var(--amber); }
  .structure-grid .icon { font-size: 2.25rem; }
  .structure-grid .soon { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--gray); }
  .structure-grid a.soon-card { opacity: 0.75; }
  .intro { color: var(--gray); margin: 0 0 1rem; }
</style>
</head>
<body>
<div class="topbar">
  <a href="/" class="back">← Home</a>
  <h1>New Estimate</h1>
  <form method="POST" action="/logout" style="margin:0"><button type="submit" class="logout">Log out</button></form>
</div>
<main>
  <p class="intro">What are we estimating?</p>
  <div id="grid" class="structure-grid"><div class="placeholder">Loading…</div></div>
</main>
<script>
const ICONS = { deck: '🪵', porch: '🏠', fence: '🚧', pergola: '🏛️', gazebo: '⛱️' };
fetch('/api/config').then(r => r.json()).then(cfg => {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (const [id, info] of Object.entries(cfg.structures)) {
    const a = document.createElement('a');
    a.href = '/estimate/new/' + id;
    a.innerHTML = '<span class="icon">' + (ICONS[id] || '🪵') + '</span><span>' + info.label + '</span>' +
      (info.enabled ? '' : '<span class="soon">Coming soon</span>');
    if (!info.enabled) a.classList.add('soon-card');
    grid.appendChild(a);
  }
});
</script>
</body>
</html>
