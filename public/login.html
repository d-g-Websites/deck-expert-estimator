<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Deck Expert Estimator</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" href="/static/favicon.ico" sizes="any">
<style>
  body { display: flex; align-items: center; justify-content: center; }
  .login-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 2rem; width: 100%; max-width: 360px; box-shadow: 0 2px 10px rgba(77,46,32,0.08); }
  .login-card h1 { color: var(--brown); margin: 0 0 0.25rem; font-size: 1.4rem; }
  .login-card p { color: var(--gray); margin: 0 0 1.5rem; font-size: 0.9rem; }
  .err { background: #fee2e2; color: #b91c1c; padding: 0.6rem 0.8rem; border-radius: var(--radius); margin-bottom: 1rem; font-size: 0.9rem; }
</style>
</head>
<body>
  <form class="login-card" method="POST" action="/login">
    <h1>Deck Expert Estimator</h1>
    <p>Chicago Deck Expert — internal tool</p>
    <div id="err" class="err" style="display:none">Incorrect password. Try again.</div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" autofocus required>
    </div>
    <button type="submit" class="btn primary">Sign in</button>
  </form>
  <script>
    if (new URLSearchParams(location.search).get('error')) document.getElementById('err').style.display = 'block';
    const next = new URLSearchParams(location.search).get('next');
    if (next) document.querySelector('form').action = '/login?next=' + encodeURIComponent(next);
  </script>
</body>
</html>
