# Chicago Deck Expert Estimator — nginx vhost
# Subdomain: estimator.chicagodeckexpert.com -> Node app on 127.0.0.1:3000

server {
    listen 80;
    listen [::]:80;
    server_name estimator.chicagodeckexpert.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name estimator.chicagodeckexpert.com;

    ssl_certificate /etc/letsencrypt/live/estimator.chicagodeckexpert.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/estimator.chicagodeckexpert.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allow large photo uploads (deck photos go through AI render).
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        # AI renders can take 20-40s — give them room.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
