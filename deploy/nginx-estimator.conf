# Chicago Deck Expert Estimator — nginx vhost
# Subdomain: estimator.chicagodeckexpert.com (+ www.) -> Node app on 127.0.0.1:3002
#
# This is the STARTER (HTTP-only) config. Run certbot with --nginx afterward and
# it will inject the SSL (443) server blocks and the HTTP->HTTPS redirect for
# both hostnames automatically:
#
#   certbot --nginx -d estimator.chicagodeckexpert.com -d www.estimator.chicagodeckexpert.com

server {
    listen 80;
    listen [::]:80;
    server_name estimator.chicagodeckexpert.com www.estimator.chicagodeckexpert.com;

    # Allow large photo uploads (deck photos go through AI render).
    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI renders can take 20-40s — give them room.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
